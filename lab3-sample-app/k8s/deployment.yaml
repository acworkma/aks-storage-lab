# AKS Storage Lab - Kubernetes Deployment
#
# This deployment uses a container image built from app/Dockerfile and pushed to ACR.
# The deploy-app.sh script handles building, pushing, and substituting the image reference.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-storage-app
  namespace: lab3
  labels:
    app: aks-storage-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-storage-app
  template:
    metadata:
      labels:
        app: aks-storage-app
        azure.workload.identity/use: "true"  # Enable workload identity
    spec:
      serviceAccountName: workload-identity-sa  # Use the service account from Lab 2
      containers:
      - name: app
        # Image placeholder - deploy-app.sh substitutes with ACR image
        image: aks-storage-app-python:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: AZURE_STORAGE_ACCOUNT_NAME
          value: "<your-storage-account-name>"  # deploy-app.sh substitutes this
        - name: AZURE_STORAGE_CONTAINER_NAME
          value: "<your-container-name>"  # deploy-app.sh substitutes this
        # These are automatically injected by workload identity webhook:
        # - AZURE_CLIENT_ID
        # - AZURE_TENANT_ID
        # - AZURE_FEDERATED_TOKEN_FILE
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
